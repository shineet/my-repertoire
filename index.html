<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google-site-verification" content="G6-OivW0ILWeIXetomNKwDx2BOypXSvQ" />
    <title>✦ The Repertoire — Shine</title>
    <!-- Distinct dock/home-screen icon (gold top hat) so it doesn't clash with the Booking App's blue star or the Gig Dashboard's revenue bars -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/rep-icon-180.png">
    <link rel="apple-touch-icon" href="/icons/rep-icon-512.png">
    <link rel="icon" type="image/png" href="/icons/rep-icon-512.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent
    }

    html, body {
        height: 100%;
        background: #0B0D1A;
        color: #F0EDE6;
        font-family: Inter, sans-serif;
        font-size: 14px
    }

    #app {
        position: relative;
        height: 100vh;
        overflow: hidden
    }

    #sc {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch
    }

    #ov {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, .85);
        align-items: center;
        justify-content: center;
        z-index: 200;
        padding: 12px
    }

    ::-webkit-scrollbar {
        width:4px
    }

    ::-webkit-scrollbar-thumb {
        background: #2E3260;
        border-radius: 2px
    }

    [data-hov]:hover {
        background: #161829;
        cursor: pointer
    }

    #syncbar {
        position: fixed;
        bottom: 14px;
        right: 14px;
        font-size: 11px;
        padding: 5px 13px;
        border-radius: 20px;
        z-index: 300;
        opacity: 0;
        transition: opacity .4s;
        pointer-events: none
    }

    #syncbar.show {
        opacity: 1
    }

    .desk-table, .desk-row {
        display: grid
    }

    .mob-card {
        display: none
    }

    @media (max-width: 680px) {
        .desk-table, .desk-row {
            display: none
        }

        .mob-card {
            display: block
        }

        .hdr-r button {
            font-size: 12px;
            padding: 6px 10px
        }

        .col-grid {
            grid-template-columns: 1fr !important
        }

        .notes-exp {
            padding-left: 14px !important
        }
    }
    </style>
</head>
<body>
    <div id="app">
        <div id="sc"></div>
        <div id="ov"></div>
    </div>
    <div id="syncbar"></div>

    <!-- Sign-in. The page itself carries no data now, so this gates the only
         thing worth gating: the request that fetches it. -->
    <div id="gate" style="position:fixed;inset:0;background:#0B0D1A;z-index:9999;
         display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
      <div style="font-size:26px;letter-spacing:1px;color:#E8E9F3;">&#10022; The Repertoire</div>
      <div id="gate-msg" style="font-size:13px;color:#555E7A;text-align:center;max-width:280px;">Sign in to continue</div>
      <!-- A real form with autocomplete hints, which is what lets iOS and macOS
           offer the saved password behind Face ID or Touch ID. -->
      <form id="gate-form" style="display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:280px;">
        <input type="text" name="username" autocomplete="username" value="shine"
               style="display:none;" readonly>
        <input id="gate-pw" type="password" name="password" autocomplete="current-password"
               placeholder="Password" enterkeyhint="go"
               style="width:100%;font-size:17px;padding:13px 16px;border:1px solid #2E3260;border-radius:12px;
                      background:#141733;color:#E8E9F3;text-align:center;">
        <button type="submit" id="gate-go"
                style="width:100%;font-size:16px;font-weight:600;padding:13px 20px;border:0;border-radius:12px;
                       background:#4C5BD4;color:#fff;cursor:pointer;">Open</button>
      </form>
      <div id="gate-err" style="color:#C9507A;font-size:13px;min-height:18px;text-align:center;"></div>
    </div>

    <script>
    /* The database address is deliberately NOT here any more.
     *
     * It used to be, and the database was open to the world: Google's own alert
     * said any user could read the entire thing and any user could write to it.
     * Anyone who viewed source had the address and needed nothing else.
     *
     * Everything now goes through /api/repertoire, which is the only thing
     * holding a Firebase credential. The browser cannot leak a key it never has.
     */
    const API = '/api/repertoire';
    let TOKEN = localStorage.getItem('repertoireToken') || '';
    const K = {
        bg: "#0B0D1A",
        ca: "#161829",
        br: "#1E2140",
        b2: "#2E3260",
        tx: "#F0EDE6",
        mu: "#888CAA",
        dm: "#555E7A",
        go: "#C9A047",
        re: "#C9507A",
        ip: "#0F1120"
    };
    const CC = {
        "Stage": "#7A6EC9",
        "Parlor": "#C9507A",
        "Close-Up": "#4E9C81",
        "Strolling": "#C9A047",
        "Table Hopping": "#4E8EC9",
        "Virtual": "#888CAA"
    };
    const RC = {
        "Opener": "#4E9C81",
        "Feature": "#C9A047",
        "Closer": "#C9507A",
        "Anytime": "#7A6EC9"
    };
    const SC = {
        "Active": "#4E9C81",
        "In Development": "#C9A047",
        "Retired": "#555E7A"
    };
    const CTX = ["Stage", "Parlor", "Close-Up", "Strolling", "Table Hopping", "Virtual"];
    const ROLES = ["Opener", "Feature", "Closer", "Anytime"];
    const DIFFS = ["Beginner", "Intermediate", "Advanced", "Expert"];
    const STS = ["Active", "In Development", "Retired"];
    /* The seed routine list used to live here: 118 routines with their method
     * notes, inline in a page served to anyone who asked for it, and committed
     * to a public GitHub repo. A login screen cannot hide something already in
     * the file the browser downloaded, so the data had to leave the file.
     *
     * It is gone rather than moved. Firebase held 136 routines against the
     * seed's 118, and three seed entries (m32, m60, m114) were not there at
     * all -- deleted at some point and resurrected on every offline load. The
     * seed was stale, so the database is simply the source of truth now.
     */

    // App State
    let R = [],
        G = [],
        view = 'master',
        gid = null,
        modal = null,
        detailId = null;
    let cxF = [],
        roF = [],
        stF = 'Active',
        q = '';
    let expanded = new Set();
    let reordering = false;
    let reorderingGig = false;
    let saveTimer = null;
    function debounceSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => save(), 1200);
    }
    const isTemplate = g => g.type === 'template' || (g.client || '').toLowerCase() === 'template';
    let rF = {
        name: '',
        duration: '',
        difficulty: 'Intermediate',
        status: 'Active',
        roles: [],
        contexts: [],
        notes: '',
        props: []
    };
    let rEid = null,
        gF = {
            name: '',
            date: '',
            client: '',
            notes: ''
        },
        gEid = null,
        dN = '',
        dFr = null,
        pCx = [],
        pQ = '';
    let lastSave = 0;
    // Global set of prop names (lowercased) that are electronic devices needing a
    // charge. It's a property of the device, not the routine, so it lives at the root.
    let CHARGE = {};
    const needsCharge = label => !!CHARGE[String(label || '').toLowerCase()];

    // Helpers
    const uid = () => Math.random().toString(36).slice(2, 10);
    const fmt = m => !m ? '—' : +m >= 60 ? `${Math.floor(+m / 60)}h ${+m % 60}m` : `${m}m`;
    const tot = a => a.reduce((s, r) => s + (+r.duration || 0), 0);
    const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const cg = () => G.find(g => g.id === gid);
    const gr = () => {
        const g = cg();
        return g ? g.routineIds.map(id => R.find(r => r.id === id)).filter(Boolean) : [];
    };
    const inG = id => !!cg()?.routineIds.includes(id);
    // Deduped prop list for the current gig, parsed live from each routine's
    // "Props:" notes line, in setlist order (each prop at its first appearance).
    const gigProps = () => {
        const m = {};
        gr().forEach(r => parsePropsFromNotes(r.notes).forEach(p => {
            const k = p.toLowerCase();
            if (!m[k]) m[k] = { label: p, routines: [] };
            m[k].routines.push(r.name);
        }));
        return Object.values(m);
    };

    // Firebase, reached only through the server. Same two function names and the
    // same signatures as before, so every caller is unchanged -- what moved is
    // where the credential lives, not how the app asks for its data.
    async function apiCall(payload) {
        const r = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...payload, token: TOKEN })
        });
        if (r.status === 401) {
            // The password changed, or this token predates it. Send them back to
            // the gate rather than failing quietly and looking like a sync bug.
            TOKEN = '';
            localStorage.removeItem('repertoireToken');
            showGate('Session expired — sign in again.');
            throw new Error('not signed in');
        }
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
        return j;
    }
    async function fbGet(path) {
        return (await apiCall({ action: 'get', path })).data;
    }
    async function fbPut(path, data) {
        await apiCall({ action: 'put', path, data });
    }
    function showSync(msg, color) {
        const b = document.getElementById('syncbar');
        b.textContent = msg;
        b.style.background = color || '#1E2140';
        b.style.color = color ? '#fff' : '#888CAA';
        b.classList.add('show');
        setTimeout(() => b.classList.remove('show'), 2800);
    }

    // Pull a "Props: a, b, c" line out of a routine's notes so existing routines
    // pre-fill their props list without re-typing. Non-destructive: notes are left as-is.
    function parsePropsFromNotes(notes) {
        const m = String(notes || '').match(/^\s*props?\s*:\s*(.+)$/im);
        if (!m) return [];
        return m[1].split(/[,;]+/).map(s => s.trim()).filter(Boolean);
    }

    // Normalize a routine/gig from storage. Used by BOTH load() and sync() so a
    // cloud copy pulled by sync gets the same shape (incl. props migration + packed),
    // otherwise sync would overwrite freshly-migrated props with a prop-less copy.
    const normR = r => ({
        id: r.id,
        name: r.name || '',
        duration: r.duration || 0,
        difficulty: r.difficulty || 'Intermediate',
        status: r.status || 'Active',
        roles: Array.isArray(r.roles) ? r.roles : [],
        contexts: Array.isArray(r.contexts) ? r.contexts : [],
        notes: r.notes || '',
        props: Array.isArray(r.props) ? r.props : parsePropsFromNotes(r.notes)
    });
    const normG = g => ({
        id: g.id,
        name: g.name || '',
        date: g.date || '',
        client: g.client || '',
        notes: g.notes || '',
        routineIds: Array.isArray(g.routineIds) ? g.routineIds : [],
        createdFrom: g.createdFrom || null,
        type: g.type || null,
        srcId: g.srcId || null,
        importedFrom: g.importedFrom || null,
        srcNote: g.srcNote || null,
        srcRoutines: Array.isArray(g.srcRoutines) ? g.srcRoutines : null,
        packed: (g.packed && typeof g.packed === 'object' && !Array.isArray(g.packed)) ? g.packed : {},
        // Set remotely by the Booking App's "Mark as Done" (see markRepertoireGigCompleted
        // in gig-dashboard.html) via a direct write to this same Firebase DB, keyed by
        // srcId. Forces a same-day (or future-dated) gig straight into Past Gigs instead
        // of waiting for its date to pass -- see the upcoming/past split in rGigs().
        completed: !!g.completed
    });

    async function load() {
        // True if storage was missing props/packed and we derived them, so we can
        // persist once and stop re-deriving (which the sync could otherwise clobber).
        let needsMigrationSave = false;
        try {
            showSync('Loading…', '#2E3260');
            const data = await fbGet('/');
            if (data && data.routines) {
                const raw = Object.values(data.routines).filter(r => r && r.id && r.name);
                // Only worth persisting when a routine has real props in its notes but
                // none stored yet. Empty props don't persist in Firebase anyway, so
                // checking "no props field" alone would re-save every load pointlessly.
                if (raw.some(r => !Array.isArray(r.props) && parsePropsFromNotes(r.notes).length)) needsMigrationSave = true;
                R = raw.map(normR);
            } else {
                // Nothing to seed from any more, and nothing to seed. An empty
                // database now means exactly that, rather than an invitation to
                // repopulate it from a stale copy baked into the page.
                R = [];
            }
            G = (data && data.gigs ? Object.values(data.gigs).filter(g => g && g.id && g.name) : []).map(normG);
            CHARGE = (data && data.chargeables && typeof data.chargeables === 'object' && !Array.isArray(data.chargeables)) ? data.chargeables : {};
            showSync('✓ Loaded');
        } catch (e) {
            // There is no local copy to fall back to now, so say so plainly
            // instead of showing a stale list that looks like the real one.
            R = [];
            G = [];
            showSync('Could not load — check connection', '#C9507A');
        }
        // Persist the one-time props/packed migration so it becomes real stored data.
        if (needsMigrationSave) {
            try { await save(); } catch (e) {}
        }
        // Check URL params from booking app: ?gig=<clientId>&date=&event=&name=&title=
        try {
            const params = new URLSearchParams(window.location.search);
            const pGig = params.get('gig');    // booking client id — stable link
            const pDate = params.get('date');
            const pName = params.get('name');
            const pEvent = params.get('event');
            const pTitle = params.get('title');
            const pView = params.get('view');
            const findByDate = () => {
                // Exclude gigs already linked to a DIFFERENT booking's srcId — otherwise two
                // bookings sharing the same event date collide and steal each other's gig.
                const byDate = G.filter(g => g.date === pDate && !isTemplate(g) && (!g.srcId || g.srcId === pGig));
                if (byDate.length === 1) return byDate[0];
                if (byDate.length > 1 && pName) {
                    const nl = pName.toLowerCase();
                    return byDate.find(g => g.name.toLowerCase().includes(nl) || (g.client || '').toLowerCase().includes(nl)) || byDate[0];
                }
                return byDate.length ? byDate[0] : null;
            };
            if (pGig) {
                // Came from the booking dashboard: find the linked gig, else create it.
                let match = G.find(g => g.srcId === pGig && !isTemplate(g));
                if (!match && pDate) match = findByDate();
                if (!match) {
                    // First click for this booking -> create a new gig and open it to add routines
                    // pEvent is often just a generic category bucket ("Private celebration" /
                    // "Corporate event" — defaulted in select-package.js/chat.js), not a real
                    // identifying label, so it must rank below the client's actual name. pTitle
                    // stays first since it's only ever set to something deliberate and specific
                    // (e.g. a corporate event's actual name).
                    match = { id: uid(), name: (pTitle || pName || pEvent || 'New Gig'), client: pName || '', date: pDate || '', notes: '', routineIds: [], srcId: pGig };
                    G = [match, ...G];
                    try { await save(); } catch (e) {}
                } else if (!match.srcId) {
                    // Link an existing (date-matched) gig to this booking for future clicks
                    match.srcId = pGig;
                    try { await save(); } catch (e) {}
                }
                gid = match.id;
                view = 'gig';
            } else if (pDate && G.length) {
                const match = findByDate();
                if (match) { gid = match.id; view = 'gig'; }
                else view = 'gigs';
            } else if (pView === 'gigs') {
                view = 'gigs';
            }
        } catch (_) {}
        try {
            render();
        } catch (e) {
            document.getElementById('sc').innerHTML = `<div style="padding:40px;text-align:center;color:#C9507A;">
      <div style="font-size:18px;margin-bottom:12px;">Something went wrong.</div>
      <div style="font-size:13px;color:#555E7A;margin-bottom:24px;">${
            e.message}</div>
      <button onclick="location.reload()" style="background:#1E2140;color:#888CAA;border:none;border-radius:8px;padding:10px 20px;cursor:pointer;font-family:inherit;font-size:14px;">Reload</button>
    </div>`

            ;
        }
        setInterval(sync, 20000);
    }

    async function save() {
        lastSave = Date.now();
        try {
            const ro = R.reduce((a, r) => ({
                ...a,
                [r.id]: r
            }), {});
            const go = G.reduce((a, g) => ({
                ...a,
                [g.id]: g
            }), {});
            await fbPut('/', {
                routines: ro,
                gigs: go,
                chargeables: CHARGE
            });
            showSync('✓ Synced across devices');
        } catch (e) {
            showSync('Save failed — check connection', '#C9507A');
        }
    }

    // Order- and property-order-insensitive serializer so a cloud copy that is
    // semantically identical (just reshuffled by Firebase) doesn't read as "changed".
    function stableStr(x) {
        if (Array.isArray(x))
            return '[' + x.map(stableStr).join(',') + ']';
        if (x && typeof x === 'object')
            return '{' + Object.keys(x).sort().map(k => JSON.stringify(k) + ':' + stableStr(x[k])).join(',') + '}';
        return JSON.stringify(x);
    }

    async function sync() {
        if (Date.now() - lastSave < 15000)
            return;
        // Don't clobber an in-progress edit: skip this cycle while a field is focused.
        const ae = document.activeElement;
        if (ae && ae.matches && ae.matches('textarea, input, [contenteditable="true"]'))
            return;
        try {
            const data = await fbGet('/');
            if (!data)
                return;
            const newR = data.routines ? Object.values(data.routines).filter(r => r && r.id && r.name).map(normR) : null;
            const newG = data.gigs ? Object.values(data.gigs).filter(g => g && g.id && g.name).map(normG) : null;
            const newC = (data.chargeables && typeof data.chargeables === 'object' && !Array.isArray(data.chargeables)) ? data.chargeables : {};
            const toMap = arr => (arr || []).reduce((a, x) => (a[x.id] = x, a), {});
            const ch = (newR && stableStr(toMap(newR)) !== stableStr(toMap(R))) ||
                       (newG && stableStr(toMap(newG)) !== stableStr(toMap(G))) ||
                       stableStr(newC) !== stableStr(CHARGE);
            if (ch) {
                if (newR)
                    R = newR;
                if (newG)
                    G = newG;
                CHARGE = newC;
                render();
                showSync('↓ Updated from another device', '#4E9C81');
            }
        } catch (e) {}
    }

    // UI Primitives
    const bdg = (l, c, sm) => `<span style="background:${c}22;color:${c};border:1px solid ${c}44;font-size:${sm ? 10 : 11}px;font-weight:600;padding:${sm ? '2px 7px' : '4px 11px'};border-radius:20px;white-space:nowrap;">${esc(l)}</span>`;
    const chip = (l, c, on, da) => `<button ${da} style="background:${on ? (c || '#C9A047') + '22' : 'transparent'};color:${on ? (c || '#C9A047') : '#555E7A'};border:1px solid ${on ? (c || '#C9A047') + '66' : '#1E2140'};border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:${on ? 600 : 400};">${esc(l)}</button>`;
    const btn = (l, da, v, sm) => {
        v = v || 'gh';
        const vs = {
            go: `background:#C9A047;color:#0B0D1A;border:none`,
            gh: `background:#1E2140;color:#888CAA;border:none`,
            re: `background:#C9507A22;color:#C9507A;border:none`,
            ot: `background:transparent;color:#C9A047;border:1px solid #2E3260`
        };
        return `<button ${da} style="${vs[v]};border-radius:8px;padding:${sm ? '5px 11px' : '9px 18px'};font-size:${sm ? 11 : 14}px;font-weight:${v === 'go' ? 700 : 500};cursor:pointer;font-family:inherit;">${l}</button>`;
    };
    const inp = (id, val, ph, tp) => `<input id="${id}" type="${tp || 'text'}" value="${esc(val || '')}" placeholder="${esc(ph || '')}" style="width:100%;background:#0F1120;border:1px solid #2E3260;border-radius:8px;padding:10px 12px;color:#F0EDE6;font-size:14px;outline:none;box-sizing:border-box;font-family:inherit;">`;
    const sel = (id, val, ops) => `<select id="${id}" style="width:100%;background:#0F1120;border:1px solid #2E3260;border-radius:8px;padding:10px 12px;color:#F0EDE6;font-size:14px;outline:none;box-sizing:border-box;font-family:inherit;">${ops.map(o => `<option${o === val ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    const ta = (id, val, ph, rows) => `<textarea id="${id}" rows="${rows || 4}" placeholder="${esc(ph || '')}" style="width:100%;background:#0F1120;border:1px solid #2E3260;border-radius:8px;padding:10px 12px;color:#F0EDE6;font-size:14px;outline:none;resize:vertical;box-sizing:border-box;font-family:inherit;line-height:1.6;">${esc(val || '')}</textarea>`;
    const lb = l => `<div style="font-size:10px;color:#555E7A;letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px;">${l}</div>`;
    const TH = `font-size:10px;color:#555E7A;text-transform:uppercase;letter-spacing:.1em;font-weight:600;`;
    const GCOL = 'display:grid;grid-template-columns:30px 30px 2fr 1.5fr 1fr 60px 110px 90px;gap:8px;';
    const DCOL = 'display:grid;grid-template-columns:50px 2fr 1.5fr 1fr 65px 80px;gap:8px;';

    // Header
    function rHeader() {
        const nav = (v, l, mv) => `<button data-a="nav-${v}" style="background:${view === mv || view === v ? '#161829' : 'transparent'};color:${view === mv || view === v ? '#C9A047' : '#555E7A'};border:1px solid ${view === mv || view === v ? '#1E2140' : 'transparent'};border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit;">${l}</button>`;
        let btns = '';
        if (view === 'master')
            btns = `<span style="font-size:12px;color:#555E7A;align-self:center;">${R.length} routines</span> ` + btn(reordering ? '✓ Done' : 'Edit Order', 'data-a="tog-reorder"', reordering ? 'go' : 'ot', true) + ' ' + btn('+ Routine', 'data-a="open-add-r"', 'go');
        else if (view === 'gigs')
            btns = btn('+ New Gig', 'data-a="open-add-g"', 'go');
        else if (view === 'gig') {
            const g = cg();

    function render() {
        const wasFocused = document.activeElement?.id === 'srch';
        const cursorPos = wasFocused ? document.activeElement.selectionStart : null;
        let main = '';
        if (view === 'master')
            main = rMaster();
        else if (view === 'gigs')
            main = rGigs();
        else if (view === 'gig')
            main = rGigDetail();
        document.getElementById('sc').innerHTML = rHeader() + main;
        rModal();
        autoResizeTAs();
        const s = document.getElementById('srch');
        if (s) {
            s.oninput = e => {
                q = e.target.value;
                render();
            };
            if (wasFocused) {
                s.focus();
                if (cursorPos !== null)
                    s.setSelectionRange(cursorPos, cursorPos);
            }
        }
    }

    // Close modal clicking backdrop
    document.getElementById('ov').addEventListener('click', function(e) {
        if (e.target === this) {
            modal = null;
            render();
        }
    });
    function autoResizeTAs() {
        document.querySelectorAll('textarea[data-a="edit-notes"], textarea[data-a="edit-gig-notes"]').forEach(ta => {
            ta.style.height = 'auto';
            ta.style.height = ta.scrollHeight + 'px';
        });
    }

    document.getElementById('app').addEventListener('input', function(e) {
        const ta = e.target.closest('textarea[data-a="edit-notes"], textarea[data-a="edit-gig-notes"]');
        if (!ta)
            return;
        ta.style.height = 'auto';
        ta.style.height = ta.scrollHeight + 'px';
        const id = ta.dataset.id;
        if (ta.dataset.a === 'edit-gig-notes') {
            G = G.map(g => g.id === id ? {
                ...g,
                notes: ta.value
            } : g);
        } else {
            R = R.map(r => r.id === id ? {
                ...r,
                notes: ta.value
            } : r);
        }
        debounceSave();
    });

    // All event handling
    document.getElementById('app').addEventListener('click', async function(e) {
        const el = e.target.closest('[data-a]');
        if (!el)
            return;
        const a = el.dataset.a,
            id = el.dataset.id,
            v = el.dataset.v;
        switch (a) {
        case 'nav-master':
            view = 'master';
            render();
            break;
        case 'nav-gigs':
            view = 'gigs';
            reorderingGig = false;
            render();
            break;
        case 'open-detail':
            detailId = id;
            modal = 'detail';
            rModal();
            break;
        case 'del-r-modal':
            if (!confirm('Delete this routine? This cannot be undone.'))
                break;
            R = R.filter(r => r.id !== id);
            G = G.map(g => ({
                ...g,
                routineIds: g.routineIds.filter(x => x !== id)
            }));
            modal = null;
            await save();
            render();
            break;
        case 'edit-from-detail':
            {
                const r = R.find(r => r.id === id);
                if (!r)
                    break;
                rF = {
                    name: r.name,
                    duration: r.duration,
                    difficulty: r.difficulty,
                    status: r.status,
                    roles: [...(r.roles || [])],
                    contexts: [...(r.contexts || [])],
                    notes: r.notes
                };
                rEid = id;
                modal = 'r';
                rModal();
                break;
            }
        case 'open-add-r':
            rF = {
                name: '',
                duration: 5,
                difficulty: 'Intermediate',
                status: 'Active',
                roles: ['Feature'],
                contexts: ['Stage'],
                notes: ''
            };
            rEid = null;
            modal = 'r';
            rModal();
            break;
        case 'rf-cx':
            {
                snapRF();
                rF.contexts = rF.contexts.includes(v) ? rF.contexts.filter(x => x !== v) : [...rF.contexts, v];
                rModalFocused();
                break;
            }
        case 'rf-ro':
            {
                snapRF();
                rF.roles = rF.roles.includes(v) ? rF.roles.filter(x => x !== v) : [...rF.roles, v];
                rModalFocused();
                break;
            }
        case 'tog-packed':
            {
                const k = v.toLowerCase();
                G = G.map(x => {
                    if (x.id !== gid)
                        return x;
                    const packed = { ...(x.packed || {}) };
                    if (packed[k])
                        delete packed[k];
                    else
                        packed[k] = true;
                    return { ...x, packed };
                });
                await save();
                render();
                break;
            }
        case 'reset-packed':
            G = G.map(x => x.id === gid ? { ...x, packed: {} } : x);
            await save();
            render();
            break;
        case 'tog-charge':
            {
                const k = v.toLowerCase();
                CHARGE = { ...CHARGE };
                if (CHARGE[k])
                    delete CHARGE[k];
                else
                    CHARGE[k] = true;
                await save();
                render();
                break;
            }
        case 'copy-props':
            {
                const cgg = cg();
                const list = gigProps();
                if (!cgg || !list.length)
                    break;
                const charge = list.filter(p => needsCharge(p.label));
                const chargeLine = charge.length ? '\n\n🔋 Charge the night before: ' + charge.map(p => p.label).join(', ') : '';
                const text = 'Props — ' + cgg.name + '\n' + list.map(p => '☐ ' + p.label + (needsCharge(p.label) ? ' 🔋' : '')).join('\n') + chargeLine;
                try {
                    await navigator.clipboard.writeText(text);
                    showSync('✓ Props list copied');
                } catch (e) {
                    showSync('Copy failed', '#C9507A');
                }
                break;
            }
        case 'save-r':
            {
                const n=document.getElementById('rf-name')?.value.trim();

                    break;
                const nr = {
                    name: n,
                    duration: +(document.getElementById('rf-dur')?.value) || 5,
                    difficulty:document.getElementById('rf-diff')?.value,
                    status:document.getElementById('rf-stat')?.value,
                    roles: [...rF.roles],
                    contexts: [...rF.contexts],
                    notes: document.getElementById('rf-notes')?.value || ''
                };
                if (rEid)
                    R = R.map(r => r.id === rEid ? {
                        ...r,
                        ...nr
                    } : r);
                else
                    R = [...R, {
                        id: uid(),
                        ...nr
                    }];
                modal = null;
                await save();
                render();
                break;
            }
        case 'tog-expand':
            {
                if (expanded.has(id))
                    expanded.delete(id);
                else
                    expanded.add(id);
                render();
                break;
            }
        case 'edit-notes':
            {
                const ta = document.querySelector(`textarea[data-id="${id}"]`);
                if (!ta)
                    break;
                const val = ta.value;
                R = R.map(r => r.id === id ? {
                    ...r,
                    notes: val
                } : r);
                G = G.map(g => ({
                    ...g
                }));
                debounceSave();
                break;
            }
        case 'tog-reorder':
            {
                reordering = !reordering;
                render();
                break;
            }
        case 'tog-reorder-gig':
            {
                reorderingGig = !reorderingGig;
                render();
                break;
            }
        case 'mv-r-up':
            {
                const i = R.findIndex(r => r.id === id);
                if (i <= 0)
                    break;
                [R[i - 1], R[i]] = [R[i], R[i - 1]];
                await save();
                render();
                break;
            }
        case 'mv-r-dn':
            {
                const i = R.findIndex(r => r.id === id);
                if (i < 0 || i >= R.length - 1)
                    break;
                [R[i], R[i + 1]] = [R[i + 1], R[i]];
                await save();
                render();
                break;
            }
        case 'tog-cx':
            cxF = cxF.includes(v) ? cxF.filter(x => x !== v) : [...cxF, v];
            render();
            break;
        case 'tog-ro':
            roF = roF.includes(v) ? roF.filter(x => x !== v) : [...roF, v];
            render();
            break;
        case 'tog-st':
            stF = v;
            render();
            break;
        case 'open-add-g':
            gF = {
                name: '',
                date: '',
                client: '',
                notes: '',
                type: 'show'
            };
            gEid = null;
            modal = 'g';
            render();
            break;
        case 'edit-gig':
            {
                const g = cg();
                if (!g)
                    break;
                gF = {
                    name: g.name,
                    date: g.date || '',
                    client: g.client || '',
                    notes: g.notes || '',
                    type: g.type || 'show'
                };
                gEid = g.id;
                modal = 'g';
                render();
                break;
            }
        case 'save-g':
            {
                const n=document.getElementById('gf-name')?.value.trim();
                if (!n)
                    break;
                const ng = {
                    name: n,
                    date: document.getElementById('gf-date')?.value || '',
                    client: document.getElementById('gf-client')?.value || '',
                    notes: document.getElementById('gf-notes')?.value || '',
                    type: document.getElementById('gf-type')?.value || 'show'
                };
                if (gEid)
                    G = G.map(g => g.id === gEid ? {
                        ...g,
                        ...ng
                    } : g);
                else {
                    const newg = {
                        id: uid(),
                        ...ng,
                        routineIds: [],
                        createdFrom: null
                    };
                    G = [...G, newg];
                    gid = newg.id;
                    view = 'gig';
                }
                modal = null;
                await save();
                render();
                break;
            }
        case 'open-gig':
            gid = id;
            view = 'gig';
            render();
            break;
        case 'open-note':
            {
                const g = cg();
                if (g && g.srcNote) {
                    try { await navigator.clipboard.writeText(g.srcNote); } catch (e) {}
                }
                // No reliable per-note deep link exists; open Notes with the title on the clipboard to search.
                window.location.href = 'notes://';
                break;
            }
        case 'del-g':
            if (!confirm('Delete this gig? This cannot be undone.'))
                break;
            G = G.filter(g => g.id !== id);
            if (gid === id) {
                view = 'gigs';
                gid = null;
            }
            await save();
            render();
            break;
        case 'dup-gig':
            {
                const src = cg();
                if (!src)
                    break;
                dFr = src.id;
                dN = src.name + ' — Copy';
                modal = 'dup';
                render();
                break;
            }
        case 'dup-gig2':
            {
                const src = G.find(g => g.id === id);
                if (!src)
                    break;
                dFr = id;
                dN = src.name + ' — Copy';
                modal = 'dup';
                render();
                break;
            }
        case 'save-dup':
            {
                const n=document.getElementById('dup-name')?.value.trim();
                if (!n)
                    break;
                const src = G.find(g => g.id === dFr);
                if (!src)
                    break;
                const ng = {
                    ...src,
                    id: uid(),
                    name: n,
                    date: '',
                    createdFrom: src.id,
                    type: 'show'
                };
                G = [...G, ng];
                gid = ng.id;
                view = 'gig';
                modal = null;
                await save();
                render();
                break;
            }
        case 'assign-dup':
            {
                const src = G.find(g => g.id === dFr);
                const tgt = G.find(g => g.id === id);
                if (!src || !tgt)
                    break;
                const srcIds = src.routineIds || [];
                const cur = tgt.routineIds || [];
                let ids = [...srcIds];
                if (cur.length) {
                    const replace = confirm(`"${tgt.name}" already has ${cur.length} routine(s).\n\nOK = REPLACE them with the ${srcIds.length} from "${src.name}".\nCancel = ADD these on top of the existing ones.`);
                    if (!replace)
                        ids = [...cur, ...srcIds.filter(x => !cur.includes(x))];
                }
                G = G.map(g => g.id === tgt.id ? { ...g, routineIds: ids } : g);
                gid = tgt.id;
                view = 'gig';
                modal = null;
                await save();
                render();
                break;
            }
        case 'copy-into':
            {
                modal = 'copyinto';
                render();
                break;
            }
        case 'do-copy-into':
            {
                const src = G.find(g => g.id === id);
                const tgt = cg();
                if (!src || !tgt)
                    break;
                const srcIds = src.routineIds || [];
                const cur = tgt.routineIds || [];
                let ids = [...srcIds];
                if (cur.length) {
                    const replace = confirm(`"${tgt.name}" already has ${cur.length} routine(s).\n\nOK = REPLACE them with the ${srcIds.length} from "${src.name}".\nCancel = ADD these on top of the existing ones.`);
                    if (!replace)
                        ids = [...cur, ...srcIds.filter(x => !cur.includes(x))];
                }
                G = G.map(g => g.id === tgt.id ? { ...g, routineIds: ids } : g);
                modal = null;
                await save();
                render();
                break;
            }
        case 'set-gig-type':
            {
                gF.type = v;
                const h = document.getElementById('gf-type');
                if (h)
                    h.value = v;
                rModal();
                break;
            }
        case 'open-picker':
            pCx = [];
            pQ = '';
            modal = 'picker';
            render();
            break;
        case 'pk-cx':
            pCx = pCx.includes(v) ? pCx.filter(x => x !== v) : [...pCx, v];
            rModal();
            break;
        case 'add-to-gig':
            {
                const g = cg();
                if (!g || g.routineIds.includes(id))
                    break;
                const pkScroll = document.getElementById('pk-list')?.scrollTop || 0;
                G = G.map(g => g.id === gid ? {
                    ...g,
                    routineIds: [...g.routineIds, id]
                } : g);
                await save();
                rModal();
                const pkl = document.getElementById('pk-list');
                if (pkl)
                    pkl.scrollTop = pkScroll;
                break;
            }
        case 'rem-from-gig':
            {
                const pkScroll = modal === 'picker' ? (document.getElementById('pk-list')?.scrollTop || 0) : 0;
                G = G.map(g => g.id === gid ? {
                    ...g,
                    routineIds: g.routineIds.filter(x => x !== id)
                } : g);
                await save();
                if (modal === 'picker') {
                    rModal();
                    const pkl = document.getElementById('pk-list');
                    if (pkl)
                        pkl.scrollTop = pkScroll;
                } else
                    render();
                break;
            }
        case 'mv-up':
            {
                const g = cg();
                if (!g)
                    break;
                const ids = [...g.routineIds],
                    i = ids.indexOf(id);
                if (i <= 0)
                    break;
                [ids[i - 1], ids[i]] = [ids[i], ids[i - 1]];
                G = G.map(g => g.id === gid ? {
                    ...g,
                    routineIds: ids
                } : g);
                await save();
                render();
                break;
            }
        case 'mv-dn':
            {
                const g = cg();
                if (!g)
                    break;
                const ids = [...g.routineIds],
                    i = ids.indexOf(id);
                if (i >= ids.length - 1)
                    break;
                [ids[i], ids[i + 1]] = [ids[i + 1], ids[i]];
                G = G.map(g => g.id === gid ? {
                    ...g,
                    routineIds: ids
                } : g);
                await save();
                render();
                break;
            }
        case 'close-modal':
            modal = null;
            render();
            break;
        }
    });

    /* ── Sign-in ──────────────────────────────────────────────────────────────
     *
     * The password is checked on the server, which is the only reason this is
     * worth anything: a check in here would be one View Source away from being
     * skipped. What this code does is hold a token and get out of the way.
     *
     * navigator.credentials.store is what makes it feel like a passkey on the
     * phone and the laptop -- it offers the password to iCloud Keychain, and
     * from then on iOS and macOS fill it behind Face ID or Touch ID. Same trick
     * as the booking app and the gig dashboard. It is a saved password with
     * biometric autofill rather than a true WebAuthn passkey; the protection
     * comes from the server check either way.
     */
    function showGate(msg) {
        const g = document.getElementById('gate');
        if (!g) return;
        g.style.display = 'flex';
        if (msg) document.getElementById('gate-msg').textContent = msg;
    }
    function hideGate() {
        const g = document.getElementById('gate');
        if (g) g.style.display = 'none';
    }

    async function signIn(pw) {
        const r = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'login', password: pw })
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.token) throw new Error(j.error || 'Could not sign in.');
        TOKEN = j.token;
        localStorage.setItem('repertoireToken', TOKEN);
        // Offer it to the password manager so Face ID fills it next time.
        try {
            if (window.PasswordCredential) {
                navigator.credentials.store(new window.PasswordCredential({
                    id: 'shine', name: 'The Repertoire', password: pw
                }));
            }
        } catch (e) {}
    }

    document.getElementById('gate-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('gate-go');
        const err = document.getElementById('gate-err');
        const pw = document.getElementById('gate-pw').value;
        if (!pw) return;
        btn.disabled = true; btn.textContent = 'Checking…'; err.textContent = '';
        try {
            await signIn(pw);
            hideGate();
            await load();
        } catch (ex) {
            err.textContent = ex.message;
            document.getElementById('gate-pw').select();
        } finally {
            btn.disabled = false; btn.textContent = 'Open';
        }
    });

    // A stored token skips the gate entirely, so this only ever asks once per
    // device unless the password changes. If the token is stale, apiCall's 401
    // handler puts the gate back up.
    if (TOKEN) { hideGate(); load(); } else { showGate(); }
    </script>
</body>
</html>
